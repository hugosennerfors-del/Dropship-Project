# Filen ligger i samma mapp som appen. Inget "base": den indirektionen var det
# som gjorde att bygget aldrig kördes — kör alltid netlify-kommandon härifrån.
[build]
  command       = "npm run build"
  publish       = "out"
  # Explicit, så katalogen inte beror på var kommandot råkar köras ifrån.
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "22"

# Backenden genererar länkar som "/products/SPC-001". Produktsidan ligger på
# /produkt — utanför /products/ — just för att det här mönstret annars sväljer
# allt under den sökvägen, inklusive Next egna datafiler (/products/detail.txt
# gav sku="detail.txt" och en tom sida). Utanför prefixet kan det inte krocka.
[[redirects]]
  from   = "/products/:sku"
  to     = "/produkt?sku=:sku"
  status = 302

# Dashboarden visar omsättning, marginaler och inköpspris.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag            = "noindex, nofollow"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'none'"
