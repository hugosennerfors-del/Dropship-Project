<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Vad uppmärksamhet kostar — Meta-CPM per marknad">
<title>Vad uppmärksamhet kostar — Meta-CPM per marknad</title>
<rect width="880" height="250" rx="10" fill="#fcfcfb" stroke="#e7e6e2"/>
<text x="28" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#0b0b0b">Vad uppmärksamhet kostar — Meta-CPM per marknad</text>
<text x="28" y="57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e">Tre olika mätningar från tre leverantörer. De är inte strikt jämförbara, därför står de som separata tal.</text>
<text x="28" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Källor: Lebesgue, superads, Adligator (2026). Poängen är storleksordningen, inte decimalerna.</text>
<rect x="28" y="82" width="261" height="112" rx="8" fill="#ffffff" stroke="#e7e6e2"/>
<rect x="28" y="82" width="4" height="112" rx="2" fill="#2a78d6"/>
<text x="48" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e">Sverige</text>
<text x="48" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#0b0b0b">$9,10–13,50</text>
<text x="48" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Lägst i Västeuropa. Spannet är två</text>
<text x="48" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">olika mätfönster, inte en trend.</text>
<rect x="309" y="82" width="261" height="112" rx="8" fill="#ffffff" stroke="#e7e6e2"/>
<rect x="309" y="82" width="4" height="112" rx="2" fill="#c5c4be"/>
<text x="329" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e">Globalt snitt</text>
<text x="329" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#0b0b0b">~$20,90</text>
<text x="329" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">12 mån jul 2025 – jun 2026.</text>
<text x="329" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Samma källa som Sveriges $13,50.</text>
<rect x="591" y="82" width="261" height="112" rx="8" fill="#ffffff" stroke="#e7e6e2"/>
<rect x="591" y="82" width="4" height="112" rx="2" fill="#c5c4be"/>
<text x="611" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e">USA</text>
<text x="611" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#0b0b0b">$22–23</text>
<text x="611" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Ungefär dubbelt mot Sverige.</text>
<text x="611" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Därför testar du inte i USA först.</text>
</svg>