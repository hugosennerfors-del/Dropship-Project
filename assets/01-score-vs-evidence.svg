<text x="28" y="57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e">Score = bedömning enligt rubriken. Evidence = hur starkt underlaget bakom bedömningen är.</text>
<text x="28" y="544" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Ingen produkt når Evidence 90+: Google Trends, Amazon, Meta Ad Library och Kalodata gick inte att nå förstahands.</text>
