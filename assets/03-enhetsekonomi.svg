<text x="28" y="57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e">Retailpris fördelat på inköp, utgående frakt och bidrag. Bidraget är det som betalar annonserna.</text>
<text x="28" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Inköp och frakt är mina estimat (kap. 4), inte offerter. Break-even ROAS = 1 ÷ bidragsmarginal.</text>
