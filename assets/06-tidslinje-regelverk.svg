<svg xmlns="http://www.w3.org/2000/svg" width="880" height="704" viewBox="0 0 880 704" role="img" aria-label="Regelverk och säsong — tidslinje 2024–2028">
<title>Regelverk och säsong — tidslinje 2024–2028</title>
<rect width="880" height="704" rx="10" fill="#fcfcfb" stroke="#e7e6e2"/>
<text x="28" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#0b0b0b">Regelverk och säsong — tidslinje 2024–2028</text>
<text x="28" y="57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e">Datumen är fastställda i EU-källor och svenska källor. Hanteringsavgiften är ett förslag, textil-EPR saknar svenskt startdatum.</text>
<text x="28" y="688" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Källor: EU-kommissionen (Taxation &amp; Customs Union), Naturvårdsverket, reviderat avfallsdirektiv (EU) 2025/1892.</text>
<rect x="28.0" y="96.0" width="10" height="10" rx="2.5" fill="#52514e"/>
<text x="44.0" y="105.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e">Redan i kraft</text>
<rect x="146.7" y="96.0" width="10" height="10" rx="2.5" fill="#2a78d6"/>
<text x="162.7" y="105.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e">Idag</text>
<rect x="211.4" y="96.0" width="10" height="10" rx="2.5" fill="#eb6834"/>
<text x="227.4" y="105.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e">Framför dig</text>
<line x1="238" y1="126" x2="238" y2="615" stroke="#ecebe7" stroke-width="2"/>
<text x="212" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="end">13 dec 2024</text>
<circle cx="238" cy="140" r="5.5" fill="#52514e" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="266" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">GPSR träder i kraft</text>
<text x="266" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">EU Responsible Person, spårbarhet och varningar krävs vid försäljningsstället</text>
<text x="212" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="end">18 aug 2025</text>
<circle cx="238" cy="186" r="5.5" fill="#52514e" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="266" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">EU:s batteriförordning fullt tillämplig</text>
<text x="266" y="203" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Förordning (EU) 2023/1542 ersätter direktiv 2006/66/EG</text>
<text x="212" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="end">15 jan 2026</text>
<circle cx="238" cy="232" r="5.5" fill="#52514e" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="266" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Batteriregistrering kompletteras</text>
<text x="266" y="249" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Kemisk sammansättning, skattenummer och tilldelad producentansvarsorganisation</text>
<text x="212" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="end">19 jun 2026</text>
<circle cx="238" cy="278" r="5.5" fill="#52514e" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="266" y="279" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Ångerknapp blir obligatorisk</text>
<text x="266" y="295" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Gäller alla webbshoppar som säljer till EU-konsumenter, oavsett etableringsland</text>
<text x="212" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="end">1 jul 2026</text>
<circle cx="238" cy="324" r="5.5" fill="#52514e" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="266" y="325" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">€150-tullfriheten slopas</text>
<text x="266" y="341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">€3 i tull per rad i tulldeklarationen för försändelser ≤ €150</text>
<text x="212" y="375" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="end">12 aug 2026</text>
<circle cx="238" cy="370" r="5.5" fill="#52514e" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="266" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Svenskt ombud krävs</text>
<text x="266" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">För företag utan svensk etablering som säljer förpackade varor till svenska konsumenter</text>
<text x="212" y="421" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#2a78d6" text-anchor="end">14 sep 2026</text>
<circle cx="238" cy="416" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2.5"/>
<circle cx="238" cy="416" r="14" fill="none" stroke="#2a78d6" stroke-width="1.5" opacity="0.4"/>
<text x="266" y="417" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Researchen gjord</text>
<text x="266" y="433" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Allt nedan ligger framför dig</text>
<text x="212" y="467" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="end">~1 nov 2026</text>
<circle cx="238" cy="462" r="5.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="266" y="463" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">EU-hanteringsavgift</text>
<text x="266" y="479" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Föreslagen av kommissionen — ännu inte beslutad</text>
<text x="212" y="513" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="end">27 nov 2026</text>
<circle cx="238" cy="508" r="5.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="266" y="509" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Black Friday</text>
<text x="266" y="525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Black Week 23–29 nov. Sista realistiska tillfället att hinna testa innan peak</text>
<text x="212" y="559" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="end">2027–2028</text>
<circle cx="238" cy="554" r="5.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="266" y="555" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Textil-EPR i drift</text>
<text x="266" y="571" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">Reviderat avfallsdirektiv (EU) 2025/1892. Svenskt startdatum ännu okänt</text>
<text x="212" y="605" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="end">1 jul 2028</text>
<circle cx="238" cy="600" r="5.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="266" y="601" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Övergångsregimen upphör</text>
<text x="266" y="617" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">€3-regimen löper ut och ersätts av permanent ordning</text>
</svg>